<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mentor | Final-Year B.Tech CSE Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div style="display: flex; flex-direction: column; gap: 24px;">
                <!-- Brand Header -->
                <div class="sidebar-brand">
                    <div class="brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 22 22 22 12 2"/></svg>
                    </div>
                    <div class="brand-info">
                        <h2>AI Mentor</h2>
                        <p>Build. Learn. Ship.</p>
                    </div>
                </div>

                <!-- Main Navigation Links (Matches Screenshot) -->
                <nav class="sidebar-nav">
                    <button class="sidebar-item active" id="nav-exercises" onclick="selectSidebarItem('exercises')">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                        <span>Lab Exercises</span>
                    </button>
                    <button class="sidebar-item" id="nav-dsa" onclick="selectSidebarItem('dsa')">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                        <span>DSA & Algorithms</span>
                    </button>
                    <button class="sidebar-item" id="nav-os" onclick="selectSidebarItem('os')">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
                        <span>OS & Concurrency</span>
                    </button>
                    <button class="sidebar-item" id="nav-dbms" onclick="selectSidebarItem('dbms')">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                        <span>DBMS & System Design</span>
                    </button>
                    <button class="sidebar-item" id="nav-networks" onclick="selectSidebarItem('networks')">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                        <span>Networks & Dist. Sys</span>
                    </button>
                    <button class="sidebar-item" id="nav-ai" onclick="selectSidebarItem('ai')">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2a8 8 0 0 0-8 8c0 3.31 2.01 6.16 4.9 7.37.4.07.55-.17.55-.38v-1.46c-2.22.48-2.69-1.07-2.69-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .22.15.46.55.38A8.01 8.01 0 0 0 20 10a8 8 0 0 0-8-8z"></path></svg>
                        <span>AI & LLM Architecture</span>
                    </button>
                    <button class="sidebar-item" id="nav-viva" onclick="selectSidebarItem('viva')">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <span>Viva Voce Defense</span>
                    </button>
                    <button class="sidebar-item" id="nav-marks" onclick="selectSidebarItem('marks')">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"></path></svg>
                        <span>Evaluation Rubric</span>
                    </button>
                </nav>
            </div>

            <!-- Sidebar Bottom: Active Model Dropdown & RAG Toggle -->
            <div class="sidebar-bottom">
                <span class="sidebar-bottom-label">Active Model</span>
                <div class="model-dropdown-trigger">
                    <div class="model-name">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                        <span id="selected-model-label">GPT-OSS 20B</span>
                    </div>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    <select id="model-select" onchange="onModelChange(this.value)">
                        <option value="openai/gpt-oss-20b" selected>GPT-OSS 20B</option>
                        <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
                        <option value="qwen/qwen3.8-27b">Qwen 3.8 27B</option>
                    </select>
                </div>

                <div class="rag-toggle-row">
                    <label class="toggle-switch">
                        <input type="checkbox" id="rag-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="rag-toggle-label">RAG Grounding</span>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-view">
            <!-- Top App Bar -->
            <header class="top-bar">
                <h1 class="page-title" id="page-title">Exercises</h1>
                <div class="top-bar-actions">
                    <div class="week-selector">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        <select id="week-dropdown" class="clean-week-select" onchange="switchWeek(this.value)">
                            <option value="w3" selected>Week 3</option>
                            <option value="w4">Week 4</option>
                        </select>
                    </div>

                    <div class="user-avatar-pill">KD</div>
                </div>
            </header>

            <!-- Exercise Tab Bar (01 Basic LLM App, 02 ..., 03 ...) -->
            <nav class="exercise-tab-nav" id="exercise-tab-nav">
                <!-- Injected via JS based on selected week -->
            </nav>

            <!-- Dynamic Content Workspace Container -->
            <div class="view-container" id="view-container">
                <!-- Injected dynamically via renderExerciseContent() in app.js -->
            </div>
        </main>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
